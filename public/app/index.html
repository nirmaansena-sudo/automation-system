<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <title>Nirmaan Sena · Team app</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    body { font-size: 15px; }
    .app { max-width: 560px; margin: 0 auto; padding: 0 0 84px; min-height: 100vh; }
    .appbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .appbar .grow { flex: 1; }
    .sec { padding: 14px 16px 0; }
    .sec > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 8px; }
    .big { width: 100%; padding: 18px; font-size: 18px; border-radius: 14px; justify-content: center; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
    .tabbar a { flex: 1; max-width: 140px; text-align: center; padding: 9px 4px 10px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; }
    .tabbar a b { display: block; font-size: 19px; line-height: 1.2; }
    .tabbar a.on { color: var(--brand); }
    .offline { background: var(--warn-bg); border-bottom: 1px solid var(--warn); padding: 8px 16px; font-size: 13px; }
    .card + .card { margin-top: 10px; }
    /* messages sit above the bottom menu, never on top of it */
    #toasts { left: 12px; right: 12px; bottom: calc(72px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto; }
    /* the big buttons keep their words while working ("Getting your location…") */
    .btn.primary.big.busy { color: var(--brand-ink) !important; opacity: .9; }
    .btn.big.busy::after { position: static; color: inherit; flex: none; }
  </style>
</head>
<body>
  <div id="root" class="app"><div class="auth-wrap"><div class="muted">Loading…</div></div></div>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
